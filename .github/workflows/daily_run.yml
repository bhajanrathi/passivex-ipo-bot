name: PassiveX Daily Update

on:
  schedule:
    - cron: "15 4 * * 1-5"   # 04:15 UTC Mon-Fri = 9:45 AM IST (GitHub often starts a few minutes late)
  workflow_dispatch:          # manual test button

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scraper.py
        env:
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          WHATSAPP_CHANNEL_ID: ${{ secrets.WHATSAPP_CHANNEL_ID }}
          TEST_DATE: "2026-10-23"