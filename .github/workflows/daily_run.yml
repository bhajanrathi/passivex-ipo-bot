name: PassiveX Sunday Update

on:
  schedule:
    - cron: "30 3 * * 0"   # 03:30 UTC Sunday = 09:00 AM IST
  workflow_dispatch:        # manual test button

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scraper.py
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          WHATSAPP_CHANNEL_ID: ${{ secrets.WHATSAPP_CHANNEL_ID }}